<!doctype html>
<html><head><meta charset="utf-8"><script src="./support.js"></script></head><body>
<x-dc>
<helmet><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500&family=JetBrains+Mono:wght@400;600&display=swap"><style>
:root{color-scheme:dark;--bg:#121413;--surface:#1a1d1b;--surface2:#212522;--inset:#0e1110;--line:#2c302c;--line2:#242a25;--line-strong:#41463f;--text:#edefe9;--text2:#a4aba1;--text3:#767d74;--chrome:#171a18;--green:#43c98a;--green-strong:#5fdca0;--green-soft:rgba(67,201,138,.12);--code:#6fb4e8;--memory:#b095e8;--amber:#d9a93f;--crimson:#e07a8c;--sans:Inter,ui-sans-serif,system-ui,sans-serif;--serif:"Fraunces","Iowan Old Style",Palatino,Georgia,serif;--mono:"JetBrains Mono",ui-monospace,Menlo,Consolas,monospace;--r-control:10px;--r-panel:14px;--r-card:16px;--r-hero:22px;--code-bg:#0e1110;--code-text:#cfe0d4;--shadow-sm:0 1px 2px rgba(0,0,0,.2),0 6px 18px rgba(0,0,0,.22);--shadow-md:0 1px 2px rgba(0,0,0,.2),0 14px 36px rgba(0,0,0,.3);--glow-green:0 10px 28px rgba(67,201,138,.22)}
body{margin:0;background:var(--bg);color:var(--text);font-family:var(--sans);font-size:14px;line-height:1.5;-webkit-font-smoothing:antialiased}
a{color:var(--green)}a:hover{color:var(--green-strong)}
.chip{font-family:var(--mono);font-size:10.5px;padding:3px 9px;border-radius:var(--r-panel);border:1px solid var(--line);color:var(--text2);background:var(--surface2);white-space:nowrap}
.chip.ok{color:var(--green);border-color:color-mix(in srgb,var(--green) 45%,transparent);background:var(--green-soft)}
.chip.warn{color:var(--amber);border-color:color-mix(in srgb,var(--amber) 45%,transparent)}
.dot{width:7px;height:7px;border-radius:50%;display:inline-block}
.dot.g{background:var(--green)}.dot.a{background:var(--amber)}.dot.m{background:var(--text3)}.dot.p{background:var(--memory)}
.seclabel{font-family:var(--mono);font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:var(--text3)}
.scrim{width:720px;height:520px;background:color-mix(in srgb,var(--bg) 72%,black);display:flex;align-items:flex-start;justify-content:center;padding-top:70px;border-radius:var(--r-control)}
.pal{width:560px;background:var(--surface);border:1px solid var(--line-strong);border-radius:var(--r-card);box-shadow:var(--shadow-md);overflow:hidden}
.in{padding:15px 18px;font-size:14px;color:var(--text3);border-bottom:1px solid var(--line2)}
.grp{font-family:var(--mono);font-size:9px;letter-spacing:.14em;color:var(--text3);padding:10px 18px 4px}
.r{display:flex;align-items:center;gap:12px;padding:9px 18px;font-size:13px}
.r.on{background:var(--surface2)}
.r .k{margin-left:auto;font-family:var(--mono);font-size:10px;color:var(--text3);border:1px solid var(--line);border-radius:6px;padding:1px 7px}
.r .verb{font-family:var(--mono);font-size:9px;color:var(--green);letter-spacing:.1em;width:20px}
</style></helmet>
<div class="scrim"><div class="pal">
  <div class="in">Type a command or a run name…</div>
  <div class="grp">GO</div>
  <div class="r on"><span class="verb">go</span>Room<span class="k">1</span></div>
  <div class="r"><span class="verb">go</span>Work<span class="k">2</span></div>
  <div class="r"><span class="verb">go</span>Memory<span class="k">3</span></div>
  <div class="grp">DO</div>
  <div class="r"><span class="verb">do</span>New run…<span class="k">n</span></div>
  <div class="r"><span class="verb">do</span>Orchestrate as a goal…<span class="k">⌥⏎</span></div>
  <div class="r"><span class="verb">do</span>Next run needing you<span class="k">⌥L</span></div>
</div></div>
</x-dc>

</body></html>
