:root{color-scheme:dark;--bg:#121413;--surface:#1a1d1b;--surface2:#212522;--inset:#0e1110;--line:#2c302c;--line2:#242a25;--line-strong:#41463f;--text:#edefe9;--text2:#a4aba1;--text3:#767d74;--chrome:#171a18;--green:#43c98a;--green-strong:#5fdca0;--green-soft:rgba(67,201,138,.12);--code:#6fb4e8;--memory:#b095e8;--amber:#d9a93f;--crimson:#e07a8c;--sans:Inter,ui-sans-serif,system-ui,sans-serif;--serif:"Fraunces","Iowan Old Style",Palatino,Georgia,serif;--mono:"JetBrains Mono",ui-monospace,Menlo,Consolas,monospace;--r-control:10px;--r-panel:14px;--r-card:16px;--r-hero:22px;--code-bg:#0e1110;--code-text:#cfe0d4;--shadow-sm:0 1px 2px rgba(0,0,0,.2),0 6px 18px rgba(0,0,0,.22);--shadow-md:0 1px 2px rgba(0,0,0,.2),0 14px 36px rgba(0,0,0,.3);--glow-green:0 10px 28px rgba(67,201,138,.22)}
body{margin:0;background:var(--bg);color:var(--text);font-family:var(--sans);font-size:14px;line-height:1.5;-webkit-font-smoothing:antialiased}
a{color:var(--green)}a:hover{color:var(--green-strong)}
.chip{font-family:var(--mono);font-size:10.5px;padding:3px 9px;border-radius:var(--r-panel);border:1px solid var(--line);color:var(--text2);background:var(--surface2);white-space:nowrap}
.chip.ok{color:var(--green);border-color:color-mix(in srgb,var(--green) 45%,transparent);background:var(--green-soft)}
.chip.warn{color:var(--amber);border-color:color-mix(in srgb,var(--amber) 45%,transparent)}
.dot{width:7px;height:7px;border-radius:50%;display:inline-block}
.dot.g{background:var(--green)}.dot.a{background:var(--amber)}.dot.m{background:var(--text3)}.dot.p{background:var(--memory)}
.seclabel{font-family:var(--mono);font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:var(--text3)}
.ph{width:390px;height:844px;background:var(--bg);display:flex;flex-direction:column;overflow:hidden;border-radius:var(--r-control)}
.top{height:44px;background:var(--chrome);border-bottom:1px solid var(--line);display:flex;align-items:center;gap:8px;padding:0 10px}
.seg{display:flex;gap:2px;background:var(--surface);border:1px solid var(--line);border-radius:var(--r-panel);padding:2px}
.seg span{font-family:var(--mono);font-size:10.5px;padding:4px 10px;border-radius:8px;color:var(--text3)}
.seg .on{background:var(--surface2);color:var(--text)}
.ic{width:26px;height:26px;border:1px solid var(--line);border-radius:8px;display:flex;align-items:center;justify-content:center;color:var(--text2);font-family:var(--mono);font-size:12px}
.chat{flex:1;padding:14px;display:flex;flex-direction:column;gap:12px;overflow:hidden}
.you{border-left:3px solid var(--green);padding-left:10px;font-size:13px}
.who{font-family:var(--mono);font-size:9px;letter-spacing:.12em;color:var(--text3);margin-bottom:2px}
.you .who{color:var(--green)}
.kage{font-size:13px;line-height:1.55}
.live{margin:0 14px;background:var(--surface);border:1px solid var(--line);border-radius:var(--r-card);padding:9px 12px;display:flex;gap:8px;align-items:center;font-family:var(--mono);font-size:10px;color:var(--text2);overflow:hidden}
.live .t{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.comp{margin:10px 14px 14px;background:var(--surface);border:1px solid var(--line-strong);border-radius:var(--r-card);padding:10px 12px;display:flex;align-items:center;gap:8px}
.comp .g{flex:1;font-size:12.5px;color:var(--text3);font-style:italic}
.send{font-family:var(--mono);font-size:11px;padding:6px 12px;border-radius:var(--r-panel);background:var(--green);color:#0c130f;font-weight:700}
</style></helmet>
<div class="ph">
  <div class="top"><svg width="18" height="12" viewBox="0 0 24 16" fill="none" stroke="#43c98a" stroke-width="1.6"><path d="M1 8c3.5-4.5 7-6.8 11-6.8S19.5 3.5 23 8c-3.5 4.5-7 6.8-11 6.8S4.5 12.5 1 8Z"></path><circle cx="12" cy="8" r="3"></circle></svg><div class="seg"><span class="on">Room</span><span>Work</span><span>Memory</span></div><div style="flex:1"></div><div class="ic">＋</div><div class="ic">⌘</div></div>

</div>
</x-dc>
