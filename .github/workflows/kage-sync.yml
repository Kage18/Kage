name: Kage Sync

on:
  push:
    branches: [master, main]

jobs:
  kage-sync:
    name: Rebuild graphs and capture change memory
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: mcp/package-lock.json

      - name: Build kage CLI
        working-directory: mcp
        run: npm ci && npm run build

      - name: Generate LSP-compatible code index
        run: node mcp/dist/cli.js code-index --project . --json

      - name: Refresh indexes, code graph, and knowledge graph
        run: node mcp/dist/cli.js refresh --project . --json

      - name: Build graph registry manifest
        run: node mcp/dist/cli.js graph-registry --project . --json

      - name: Capture change memory from diff
        run: node mcp/dist/cli.js propose --project . --from-diff --json
        continue-on-error: true

      - name: Determine memory layout
        id: memory-layout
        run: |
          node mcp/dist/cli.js memory-branch status --project . --json > /tmp/memory-layout.json
          cat /tmp/memory-layout.json
          MODE=$(node -e "console.log(JSON.parse(require('fs').readFileSync('/tmp/memory-layout.json','utf8')).mode)")
          echo "mode=$MODE" >> "$GITHUB_OUTPUT"

      # Fetch kage/memory unconditionally, before it matters whether the local layout is
      # already migrated — a runner's clone may not have migrated its own worktree yet even
      # when the repo (some other machine) already has, and `git worktree add` below needs
      # the ref to exist locally to check it out.
      - name: Fetch the memory branch, if it exists
        run: git fetch origin kage/memory || echo "no kage/memory branch on origin yet"

      - name: Auto-deprecate stale packets
        run: |
          node -e "
            const { qualityReport, packetsDir } = require('./mcp/dist/kernel.js');
            const { readFileSync, writeFileSync, readdirSync } = require('fs');
            const report = qualityReport('.');
            const stale = report.packets.filter(p => p.classification === 'stale');
            const dir = packetsDir('.');
            for (const s of stale) {
              const shortId = s.id.split(':').pop();
              const files = readdirSync(dir).filter(f => f.includes(shortId));
              for (const f of files) {
                const path = \`\${dir}/\${f}\`;
                const packet = JSON.parse(readFileSync(path, 'utf8'));
                const votes = packet.quality?.votes_up ?? 0;
                if (!votes) {
                  packet.status = 'deprecated';
                  packet.updated_at = new Date().toISOString();
                  writeFileSync(path, JSON.stringify(packet, null, 2));
                  console.log('Deprecated stale packet:', packet.title);
                }
              }
            }
          "
        continue-on-error: true

      # Default layout: packets/ is committed on the code branch itself, same as always.
      - name: Commit updated memory artifacts (default layout)
        if: steps.memory-layout.outputs.mode == 'default'
        run: |
          git config user.name "kage-bot"
          git config user.email "kage-bot@users.noreply.github.com"
          # Only packets/ is durable knowledge meant to travel with the repo. Everything
          # else under .agent_memory/ (indexes, graph, code_graph, structural, metrics.json,
          # etc.) is derived/rebuildable and gitignored — staging the whole tree here would
          # re-add it if the ignore rules ever lapsed, so scope the add explicitly.
          git add .agent_memory/packets/
          if git diff --cached --quiet; then
            echo "No memory changes to commit"; exit 0
          fi
          git commit -m "chore: kage sync — rebuild graphs and update memory [skip ci]"
          # Push is race-prone: this job runs on every push, so when commits land
          # back-to-back another push can win the ref first ("fetch first"). Re-base
          # our regenerated .agent_memory/packets/ onto the latest master and retry
          # instead of failing the run. Only .agent_memory/packets/ is re-staged, so
          # this can never conflict with concurrent source commits.
          for attempt in 1 2 3 4 5; do
            if git push; then exit 0; fi
            echo "push rejected (concurrent push) — reconciling, retry ${attempt}/5"
            git fetch origin "${GITHUB_REF_NAME}"
            git reset --soft "origin/${GITHUB_REF_NAME}"
            git add .agent_memory/packets/
            if git diff --cached --quiet; then echo "already up to date"; exit 0; fi
            git commit -m "chore: kage sync — rebuild graphs and update memory [skip ci]"
            sleep $((attempt * 2))
          done
          echo "::warning::kage sync could not push after 5 retries; the next sync run will reconcile"
          exit 0

      # Migrated layout: packets/journal live on kage/memory, checked out at
      # .agent_memory/.branch-worktree — commit and push there instead. This is why the
      # migration matters for CI specifically: this job can no longer produce a commit on
      # master/main that touches memory, so two sync runs (or a sync run racing a human
      # push) can never conflict on memory again — only on kage/memory, whose append-only
      # journal makes concurrent appends trivial to reconcile (see
      # docs/design/BELIEF_MEMORY.md's storage section).
      - name: Commit updated memory artifacts (memory branch)
        if: steps.memory-layout.outputs.mode == 'branch'
        run: |
          cd .agent_memory/.branch-worktree
          git config user.name "kage-bot"
          git config user.email "kage-bot@users.noreply.github.com"
          git add packets/ journal/
          if git diff --cached --quiet; then
            echo "No memory changes to commit"; exit 0
          fi
          git commit -m "chore: kage sync — rebuild graphs and update memory [skip ci]"
          for attempt in 1 2 3 4 5; do
            if git push origin HEAD:kage/memory; then exit 0; fi
            echo "push rejected (concurrent push) — reconciling, retry ${attempt}/5"
            git fetch origin kage/memory
            git rebase origin/kage/memory
            sleep $((attempt * 2))
          done
          echo "::warning::kage sync could not push kage/memory after 5 retries; the next sync run will reconcile"
          exit 0
